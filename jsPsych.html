  },

      prompt: "あなたが実験を行う環境として適切なものを選んでください。",
      options: ["耳で聴いて分かるような大きさの工事現場の騒音が聞こえる部屋。",
        "家族やテレビの音が一切聞こえない静かな部屋でコンピュータのマイクを許可する。",
        "静かな部屋だがコンピュータの設定でマイクをオフにしている。"],
      required: true,
      name: "task_understand",
    },

    {
      prompt: "ことばを読む時はどのように発音しますか？適切なものを選んでください。",
      options: ["仲のいい地元の友達と話す時のように話す。",
        "テレビのアナウンサーが話す時のように丁寧に話す。",
        "職場の上司や学校の先生に話しかける時のように話す。"],
      required: true,
      name: "nonce_understand",
    }],

  button_label: "回答を完了する。",
  on_finish: function(data) {

    testAccuracy = 0;

    testAccuracy += Number(data.response["audio_understand"] === "画面に表示されたことばを発音しなくてはいけない。");
    testAccuracy += Number(data.response["task_understand"] === "家族やテレビの音が一切聞こえない静かな部屋でコンピュータのマイクを許可する。");
    testAccuracy += Number(data.response["nonce_understand"] === "仲のいい地元の友達と話す時のように話す。");

    testAccuracy = testAccuracy / 3;
  },
};


// If the response is not correct, the instruction is shown one more time.

  "もう一度手順を読んで確認してください。<br>",
  choices: ["もう一度確認する。"],
};
const notifytlOneMore = {
  timeline: [notifyagain],
  conditional_function: function() {
    return testAccuracy !== 1
  }
};

// If the response is correct, I appreciate a participant to understand my intension properly. After confirmation,\
//The timeline goes to experiment section.

  "それではこれから実験の練習課題を行います。<br>",
  choices: ["次へ"],
};

const notifyCorrect = {
  timeline: [Correct],
  conditional_function: function() {
    return testAccuracy === 1
  }
}

// Run conditionnally instruction and test section
const inst_test = {
  timeline: [instruction,
    test,
    notifytlOneMore,
    notifyCorrect],
  loop_function: function() {
